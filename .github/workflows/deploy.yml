# main → image in GHCR, or in a kube-dc managed registry when vars.KUBE_DC_REGISTRY
# is set (no stored registry token) → the kube-dc project in vars.KUBE_DC_NAMESPACE.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless sign-in to kube-dc
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # vars.KUBE_DC_RUNNER: a kube-dc managed runner pool's label.
    runs-on: ${{ vars.KUBE_DC_RUNNER || 'ubuntu-latest' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          app=reels-web
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ -n "${{ vars.KUBE_DC_REGISTRY }}" ]; then
            echo "image=${{ vars.KUBE_DC_REGISTRY }}/${{ vars.KUBE_DC_REGISTRY_PROJECT }}/$app:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      # A runner with its own BuildKit (a kube-dc managed runner) builds with it.
      - id: builder
        run: |
          driver=$(docker buildx inspect 2>/dev/null | awk '/^Driver:/ {print $2; exit}')
          [ -n "$driver" ] && [ "$driver" != docker ] && echo "ready=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.builder.outputs.ready != 'true'
        uses: docker/setup-buildx-action@v3
      - if: vars.KUBE_DC_REGISTRY == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A managed registry token lives 15 minutes: build first, sign in, then push
      # (the second build is all cache).
      - if: vars.KUBE_DC_REGISTRY != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.names.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign in to the managed registry
        if: vars.KUBE_DC_REGISTRY != ''
        env:
          KUBE_DC_REGISTRY: ${{ vars.KUBE_DC_REGISTRY }}
          KUBE_DC_TOKEN_URL: ${{ vars.KUBE_DC_TOKEN_URL }}
          KUBE_DC_AUDIENCE: ${{ vars.KUBE_DC_AUDIENCE }}
          KUBE_DC_CLIENT_ID: ${{ vars.KUBE_DC_CLIENT_ID || secrets.KUBE_DC_CLIENT_ID }}
          KUBE_DC_CLIENT_SECRET: ${{ secrets.KUBE_DC_CLIENT_SECRET }}
        run: deploy/registry-login.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.image }}
          # Links the package to this repository (and its visibility).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign in to kube-dc
        env:
          KUBE_DC_API_SERVER: ${{ vars.KUBE_DC_API_SERVER }}
          KUBE_DC_TOKEN_URL: ${{ vars.KUBE_DC_TOKEN_URL }}
          # Keyless when vars.KUBE_DC_AUDIENCE is set (machine identity with spec.github),
          # otherwise the client secret.
          KUBE_DC_AUDIENCE: ${{ vars.KUBE_DC_AUDIENCE }}
          KUBE_DC_CLIENT_ID: ${{ vars.KUBE_DC_CLIENT_ID || secrets.KUBE_DC_CLIENT_ID }}
          KUBE_DC_CLIENT_SECRET: ${{ secrets.KUBE_DC_CLIENT_SECRET }}
          KUBE_DC_CA_CERT: ${{ vars.KUBE_DC_CA_CERT || secrets.KUBE_DC_CA_CERT }}
        run: deploy/kubeconfig.sh
      - id: deploy
        env:
          PORT: "8080"
          HEALTH_PATH: "/"
          PULL_USER: ${{ github.repository_owner }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          # A managed registry: its platform pull Secret (kdc-registry-<registry>).
          PULL_SECRET: ${{ vars.KUBE_DC_REGISTRY_PULL_SECRET }}
        run: deploy/deploy.sh "${{ vars.KUBE_DC_NAMESPACE }}" "${{ steps.names.outputs.app }}" "${{ steps.names.outputs.image }}"
